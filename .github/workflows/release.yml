# Push a tag like v1.0.1 and this builds the zip and attaches it to a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != manifest v$V"; exit 1; }
      - run: ./scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
